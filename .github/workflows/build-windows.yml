name: Test Przegladarka (bez kompilacji EXE)

on:
  push:
    branches: [ main, stage-1-v0.2.0, stage-2-v0.3.0, stage-3-v0.3.1, stage-5-v0.5.0 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated parser and merge tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Required Rossmann NIVEA live product-search regression
        run: |
          python tests/rossmann_live_smoke.py

