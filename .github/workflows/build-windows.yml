name: Build Windows installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name Przegladarka app/main.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: cmd
        run: |
          "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" installer\Przegladarka.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Przegladarka-Setup-Windows
          path: dist-installer/Przegladarka-Setup-Windows.exe
          if-no-files-found: error
          retention-days: 30
